[project]
name = "td-mcp"
version = "1.9.0"
description = "Local-first TouchDesigner MCP: offline doc/RAG server + live bridge client + TD-side bridge."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pyyaml", "mcp>=1.0", "anyio"]

[project.optional-dependencies]
mcp = ["mcp>=1.0", "anyio"]
rag = ["sentence-transformers", "networkx"]   # dense vectors + CrossEncoder reranker + knowledge graph
scrape = ["requests", "beautifulsoup4"]
test = ["pytest", "pytest-cov", "networkx"]  # enough to run the suite (rag minus sentence-transformers/torch)
# faiss-cpu is an optional speed upgrade for the dense scorer (numpy fallback works)

[dependency-groups]
dev = ["pytest", "pytest-cov", "networkx"]

[project.scripts]
td-mcp-offline = "td_mcp.server_offline:main"
td-mcp-live = "td_mcp.server_live:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["td_mcp*"]
